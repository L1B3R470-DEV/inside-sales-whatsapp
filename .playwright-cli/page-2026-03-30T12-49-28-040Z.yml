            - heading "Open Port Check Tool:" [level=2] [ref=e175]
            - paragraph [ref=e176]: A port is a number that represents an entry to a service that is open to the network.
            - paragraph [ref=e177]: There are 65535 ports available to use. Some of the ports had been assigned to special service by INAN (Internet assigned numbers authority).
            - generic:
              - insertion:
                - iframe [ref=e179]:
                  
            - paragraph [ref=e180]:
              - text: In computer networks, an
              - strong [ref=e181]: open port
              - text: is a port that currently uses (open) by a service. An open port can be used to send or/and receive data over the network.
            - paragraph [ref=e182]: There are two known types of ports. TCP ports and UDP ports. Open port check tool can check the state of a TCP port.
            - paragraph [ref=e183]: This can be done by sending a packet using the IPv4 (IP version 4) protocol.
            - insertion [ref=e185]:
              - generic [ref=e188]:
                - heading "These are topics related to the article that might interest you" [level=2] [ref=e190]: Discover more
                - link "router" [ref=e191] [cursor=pointer]:
                  - generic "router" [ref=e192]
