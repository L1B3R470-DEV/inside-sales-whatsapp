                - link "Software Utilities" [ref=e201] [cursor=pointer]:
                  - generic "Software Utilities" [ref=e202]
                  - img [ref=e204]
            - paragraph [ref=e206]: An example can be your web browser on the client-side and a web server as the remote server.
            - generic:
              - insertion:
                - iframe [ref=e208]:
                  
            - paragraph [ref=e209]: The web server uses the default port 80 for HTTP or port 443 for HTTPS to listen and wait for connections.
            - paragraph [ref=e210]: Your browser establishes a connection to that port, using a local port. Once it connected they send and receive data between them.
            - paragraph [ref=e211]:
              - text: An
              - strong [ref=e212]: open port check tool
              - text: can be used to check if the port is currently open or not on a target machine.
            - insertion [ref=e214]
            - paragraph [ref=e216]:
              - text: It is like a port test, using this tool you can also detect
              - strong [ref=e217]: port forwarding
              - text: status.
            - insertion [ref=e219]
            - paragraph [ref=e221]: You can also use an open port check tool to remotely check if your server is being blocked by a firewall.
            - heading "Port Scanner:" [level=2] [ref=e222]
            - paragraph [ref=e223]:
              - text: A
              - strong [ref=e224]: port scanner
              - text: is a tool that can be used to scan a range of ports.
            - paragraph [ref=e225]:
              - text: A more advanced or
              - strong [ref=e226]: port checker
              - text: can scan some address or even a full network searching for ports that are open.
            - paragraph [ref=e227]: In computer security and hacking it is widely used to search for problematic open ports that suppose to be close or monitor.
            - paragraph [ref=e228]: An open port is like an open door or a window. With the right knowledge, it is possible to use this port to enter into the remote computer.
            - insertion [ref=e230]
            - paragraph [ref=e232]: Using and running a regular port scan is a good method to find open ports and close them. If an open port is found it is also used to understand why and who open it.
            - paragraph [ref=e233]: There are some very useful tools that can be used to scan the network address for open ports. Using such tools can even find address inside the organization that needs to be removed.
            - paragraph [ref=e234]:
              - text: An example of network ports scanner tool is
              - link "Nmap." [ref=e235] [cursor=pointer]:
                - /url: https://nmap.org/
              - text: Using it you can scan full subnet. It supports several scan methods like TCP SYN scan and TCP ACK scan.
            - paragraph [ref=e236]: Advanced usage of the tool can detect what is the service (process) that open the port and the operating system behind this service.
            - heading "Online port scanner:" [level=2] [ref=e237]
            - paragraph [ref=e238]:
              - text: The old art of
              - strong [ref=e239]: port scanning
              - text: is still working. Even thou that today there is a more secure method to close and monitor ports and services in the working environment.
            - paragraph [ref=e240]: For example. An Intrusion detection system (IDS) can be used to monitor the network.
            - paragraph [ref=e241]:
              - text: With the advanced of new tools
              - strong [ref=e242]: ","
              - text: an
              - strong [ref=e243]: online port scanner tool
              - text: can be used as a source to scan an environment. Scanning from outside the organization.
            - paragraph [ref=e244]:
              - text: An
              - strong [ref=e245]: online port scanner
              - text: "is a port scanner like any other port scanner. The only deferent is that it works from outside your network. re: a website – online."
            - insertion [ref=e247]
            - paragraph [ref=e249]: It is a great tool that can be used to check if you have unnecessary open ports on your computer/device that needs to be closed.
            - heading "Port forwarding:" [level=2] [ref=e250]
            - paragraph [ref=e251]:
              - strong [ref=e252]: Port forwarding
              - text: allows devices from outside your network to connect to a specific device inside your private network. This is also known as port mapping.
            - paragraph [ref=e253]:
              - text: This accomplishes by enabling
              - strong [ref=e254]: port forwarding
              - text: on your router and forward a connection to a special port. The port should be configured to pass the connection into a device in your LAN.
            - heading "Firewall:" [level=3] [ref=e255]
            - paragraph [ref=e256]: You also need to enable it on your windows firewall or the Unix IP table.
            - paragraph [ref=e257]: Firewall design for blocking and monitoring inbound and outbound traffic. Firewall monitoring the data against malicious activities.
            - paragraph [ref=e258]: In LAN (local area network) configuration the inner devices have an IP address that is only available inside the LAN. Most of the time it starts by 10.X or 192.X. The modem/router also has an external IP address that can get out to the internet.
            - insertion [ref=e260]
            - paragraph [ref=e262]: This means that every device that uses the internet actually use the external IP address to surf the web.
            - paragraph [ref=e263]: The router/DSL modem know who request the external connection and forward the requested data to that device.
            - paragraph [ref=e264]: This is accomplished automatically by the router.
            - paragraph [ref=e265]: Once port forwarding is enabled, the device that is outside the LAN will be able to connect into the inner LAN.
            - paragraph [ref=e266]: This is done by assigning a port in the router or modem to forward state. Once done the incoming data forward to the relevant inner device on the desired port.
            - paragraph [ref=e267]:
              - strong [ref=e268]: "Did You Know:"
            - paragraph [ref=e269]:
              - text: To check a list of ports that currently open on your host and to see what are the IP addresses or the host that your computer is connected to, you can use the built-in command-line tool
