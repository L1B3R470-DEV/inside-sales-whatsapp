name: inside-sales-lab

services:
  n8n-lab-postgres:
    image: postgres:16-alpine
    container_name: n8n-lab-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${N8N_LAB_POSTGRES_DB:-n8n_lab}
      - POSTGRES_USER=${N8N_LAB_POSTGRES_USER:-n8n_lab}
      - POSTGRES_PASSWORD=${N8N_LAB_POSTGRES_PASSWORD:?set N8N_LAB_POSTGRES_PASSWORD in lab env file}
    volumes:
      - n8n_lab_postgres_data:/var/lib/postgresql/data

  n8n-lab:
    image: docker.n8n.io/n8nio/n8n:2.18.7
    container_name: n8n-lab
    user: "0:0"
    restart: unless-stopped
    ports:
      - "15678:5678"
    environment:
      - HOME=/home/node
      - N8N_USER_FOLDER=/home/node
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:15678/
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-lab-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_LAB_POSTGRES_DB:-n8n_lab}
      - DB_POSTGRESDB_USER=${N8N_LAB_POSTGRES_USER:-n8n_lab}
      - DB_POSTGRESDB_PASSWORD=${N8N_LAB_POSTGRES_PASSWORD:?set N8N_LAB_POSTGRES_PASSWORD in lab env file}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=1000
      - N8N_RUNNERS_ENABLED=false
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=false
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=1
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - ROUTER_BASE_URL=http://router:8091
      - EVOLUTION_BASE_URL=http://evolution-lab:8080
      - EVOLUTION_INSTANCE=ATENDIMENTO_VENDAS_LAB
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT}
      - MAX_INPUT_CHARS=${MAX_INPUT_CHARS}
      - MAX_OUTPUT_CHARS=${MAX_OUTPUT_CHARS}
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS}
      - MAX_MSGS_PER_HOUR=${MAX_MSGS_PER_HOUR}
      - MAX_MSGS_PER_DAY=${MAX_MSGS_PER_DAY}
      - WORK_TIMEZONE=${WORK_TIMEZONE}
      - WORK_DAYS=${WORK_DAYS}
      - WORK_WINDOWS=${WORK_WINDOWS}
      - OUT_OF_HOURS_MESSAGE=${OUT_OF_HOURS_MESSAGE}
      - HIGH_VOLUME_MESSAGE=${HIGH_VOLUME_MESSAGE}
      - ATTENDANT_OPERATIONAL_HOST_ROLE=${ATTENDANT_OPERATIONAL_HOST_ROLE}
      - ATTENDANT_OPERATIONAL_HOST_IP=${ATTENDANT_OPERATIONAL_HOST_IP}
      - ATTENDANT_OPERATIONAL_DOCKER_HOST_ROLE=${ATTENDANT_OPERATIONAL_DOCKER_HOST_ROLE}
      - ATTENDANT_OPERATIONAL_DOCKER_HOST_IP=${ATTENDANT_OPERATIONAL_DOCKER_HOST_IP}
      - ATTENDANT_INTERACTIVE_HOST_ROLE=${ATTENDANT_INTERACTIVE_HOST_ROLE}
      - ATTENDANT_INTERACTIVE_HOST_IP=${ATTENDANT_INTERACTIVE_HOST_IP}
      - ATTENDANT_INTERACTIVE_MODE_ONLY=${ATTENDANT_INTERACTIVE_MODE_ONLY}
      - ATTENDANT_REJECT_LBN_AS_RUNTIME=${ATTENDANT_REJECT_LBN_AS_RUNTIME}
      - ATTENDANT_REJECT_LBN_DOCKER=${ATTENDANT_REJECT_LBN_DOCKER}
    volumes:
      - n8n_lab_data:/home/node/.n8n
    depends_on:
      - n8n-lab-postgres
      - evolution-lab
    networks:
      - default
      - production_runtime
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  evolution-lab-postgres:
    image: postgres:16-alpine
    container_name: evolution-lab-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${EVOLUTION_LAB_POSTGRES_DB:-evolution_lab}
      - POSTGRES_USER=${EVOLUTION_LAB_POSTGRES_USER:-evolution_lab}
      - POSTGRES_PASSWORD=${EVOLUTION_LAB_POSTGRES_PASSWORD:?set EVOLUTION_LAB_POSTGRES_PASSWORD in lab env file}
    volumes:
      - evolution_lab_postgres_data:/var/lib/postgresql/data

  evolution-lab-redis:
    image: redis:7-alpine
    container_name: evolution-lab-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - evolution_lab_redis_data:/data

  evolution-lab-minio:
    image: minio/minio:latest
    container_name: evolution-lab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${EVOLUTION_LAB_MINIO_ROOT_USER:-evolution_lab}
      - MINIO_ROOT_PASSWORD=${EVOLUTION_LAB_MINIO_ROOT_PASSWORD:?set EVOLUTION_LAB_MINIO_ROOT_PASSWORD in lab env file}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - evolution_lab_minio_data:/data

  evolution-lab:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-lab
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVOLUTION_LAB_POSTGRES_USER:-evolution_lab}:${EVOLUTION_LAB_POSTGRES_PASSWORD:?set EVOLUTION_LAB_POSTGRES_PASSWORD in lab env file}@evolution-lab-postgres:5432/${EVOLUTION_LAB_POSTGRES_DB:-evolution_lab}?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_lab
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-lab-redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution_lab
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CACHE_LOCAL_ENABLED=false
      - CONFIG_SESSION_PHONE_VERSION=
      - LOG_BAILEYS=error
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_IS_ON_WHATSAPP=true
      - DATABASE_SAVE_IS_ON_WHATSAPP_DAYS=7
      - DATABASE_DELETE_MESSAGE=true
      - OPENAI_ENABLED=false
      - S3_ENABLED=true
      - S3_ACCESS_KEY=${EVOLUTION_LAB_MINIO_ROOT_USER:-evolution_lab}
      - S3_SECRET_KEY=${EVOLUTION_LAB_MINIO_ROOT_PASSWORD:?set EVOLUTION_LAB_MINIO_ROOT_PASSWORD in lab env file}
      - S3_BUCKET=evolution-media
      - S3_PORT=9000
      - S3_ENDPOINT=evolution-lab-minio
      - S3_REGION=us-east-1
      - S3_USE_SSL=false
    volumes:
      - evolution_lab_data:/evolution/instances
    depends_on:
      - evolution-lab-postgres
      - evolution-lab-redis
      - evolution-lab-minio

volumes:
  n8n_lab_postgres_data:
  n8n_lab_data:
  evolution_lab_postgres_data:
  evolution_lab_redis_data:
  evolution_lab_minio_data:
  evolution_lab_data:

networks:
  production_runtime:
    external: true
    name: projeto_atendimento_whatsapp_inside_sales_default
