services:
  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  evolution:
    image: atendai/evolution-api:latest
    container_name: evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - ATTENDANT_OPERATIONAL_HOST_ROLE=${ATTENDANT_OPERATIONAL_HOST_ROLE}
      - ATTENDANT_OPERATIONAL_HOST_IP=${ATTENDANT_OPERATIONAL_HOST_IP}
      - ATTENDANT_OPERATIONAL_DOCKER_HOST_ROLE=${ATTENDANT_OPERATIONAL_DOCKER_HOST_ROLE}
      - ATTENDANT_OPERATIONAL_DOCKER_HOST_IP=${ATTENDANT_OPERATIONAL_DOCKER_HOST_IP}
      - ATTENDANT_INTERACTIVE_HOST_ROLE=${ATTENDANT_INTERACTIVE_HOST_ROLE}
      - ATTENDANT_INTERACTIVE_HOST_IP=${ATTENDANT_INTERACTIVE_HOST_IP}
      - ATTENDANT_INTERACTIVE_MODE_ONLY=${ATTENDANT_INTERACTIVE_MODE_ONLY}
      - ATTENDANT_REJECT_LBN_AS_RUNTIME=${ATTENDANT_REJECT_LBN_AS_RUNTIME}
      - ATTENDANT_REJECT_LBN_DOCKER=${ATTENDANT_REJECT_LBN_DOCKER}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CACHE_LOCAL_ENABLED=false
      - CONFIG_SESSION_PHONE_VERSION=
      - LOG_BAILEYS=error
      # Data persistence
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_IS_ON_WHATSAPP=true
      - DATABASE_SAVE_IS_ON_WHATSAPP_DAYS=7
      - DATABASE_DELETE_MESSAGE=true
      # Built-in OpenAI for speech-to-text (Whisper)
      - OPENAI_ENABLED=true
      - OPENAI_API_KEY_GLOBAL=${OPENAI_API_KEY}
      # S3/MinIO media storage
      - S3_ENABLED=true
      - S3_ACCESS_KEY=evolution
      - S3_SECRET_KEY=evolution-minio-secret
      - S3_BUCKET=evolution-media
      - S3_PORT=9000
      - S3_ENDPOINT=minio
      - S3_REGION=us-east-1
      - S3_USE_SSL=false
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      - postgres
      - redis
      - minio

  minio:
    image: minio/minio:latest
    container_name: evolution-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=evolution
      - MINIO_ROOT_PASSWORD=evolution-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  n8n:
    image: n8n-runnerless:2.11.3
    build:
      context: .
      dockerfile: docker/n8n-runnerless/Dockerfile
    container_name: n8n
    user: "0:0"
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - HOME=/home/node
      - N8N_USER_FOLDER=/home/node
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_OPTIONS=--max-old-space-size=4096
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=1
      - EXECUTIONS_MODE=regular
      - N8N_EXECUTIONS_MODE=regular
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=false
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=false
      - N8N_RUNNERS_TASK_REQUEST_TIMEOUT=300
      - N8N_RUNNERS_TASK_TIMEOUT=600
      - N8N_RUNNERS_MAX_CONCURRENCY=20
      - DB_SQLITE_POOL_SIZE=1
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=1000
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_RUNNERS_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT}
      - MAX_INPUT_CHARS=${MAX_INPUT_CHARS}
      - MAX_OUTPUT_CHARS=${MAX_OUTPUT_CHARS}
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS}
      - MAX_MSGS_PER_HOUR=${MAX_MSGS_PER_HOUR}
      - MAX_MSGS_PER_DAY=${MAX_MSGS_PER_DAY}
      - WORK_TIMEZONE=${WORK_TIMEZONE}
      - WORK_DAYS=${WORK_DAYS}
      - WORK_WINDOWS=${WORK_WINDOWS}
      - OUT_OF_HOURS_MESSAGE=${OUT_OF_HOURS_MESSAGE}
      - HIGH_VOLUME_MESSAGE=${HIGH_VOLUME_MESSAGE}
      - ATTENDANT_OPERATIONAL_HOST_ROLE=${ATTENDANT_OPERATIONAL_HOST_ROLE}
      - ATTENDANT_OPERATIONAL_HOST_IP=${ATTENDANT_OPERATIONAL_HOST_IP}
      - ATTENDANT_OPERATIONAL_DOCKER_HOST_ROLE=${ATTENDANT_OPERATIONAL_DOCKER_HOST_ROLE}
      - ATTENDANT_OPERATIONAL_DOCKER_HOST_IP=${ATTENDANT_OPERATIONAL_DOCKER_HOST_IP}
      - ATTENDANT_INTERACTIVE_HOST_ROLE=${ATTENDANT_INTERACTIVE_HOST_ROLE}
      - ATTENDANT_INTERACTIVE_HOST_IP=${ATTENDANT_INTERACTIVE_HOST_IP}
      - ATTENDANT_INTERACTIVE_MODE_ONLY=${ATTENDANT_INTERACTIVE_MODE_ONLY}
      - ATTENDANT_REJECT_LBN_AS_RUNTIME=${ATTENDANT_REJECT_LBN_AS_RUNTIME}
      - ATTENDANT_REJECT_LBN_DOCKER=${ATTENDANT_REJECT_LBN_DOCKER}
      - ROUTER_BASE_URL=http://router:8091
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - evolution
      - router
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  router:
    image: attendant-router:latest
    build:
      context: .
      dockerfile: docker/router/Dockerfile
    container_name: router
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ROUTER_ML_DIR=/knowledge
      - ROUTER_DB_PATH=/runtime/router_runtime.sqlite
      - ROUTER_CRM_PATH=/runtime/crm_operacional.sqlite
      - ROUTER_QDRANT_PATH=/vector_store
      - ROUTER_LOG_FORMAT=json
      - ROUTER_ENFORCE_TEST_GATE=false
      - ROUTER_BASE_URL=http://router:8091
      - ROUTER_EVOLUTION_API_URL=http://evolution:8080
    volumes:
      - C:/AUTOMACAO/rag/knowledge:/knowledge:ro
      - C:/AUTOMACAO/dados:/runtime
      - C:/AUTOMACAO/rag/vector_store:/vector_store
    ports:
      - "8091:8091"
    networks:
      - default
      - legacy_runtime
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=5).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  n8n-autoheal:
    image: python:3.11-slim
    container_name: n8n-autoheal
    restart: unless-stopped
    depends_on:
      - n8n
    volumes:
      - n8n_data:/data
      - ./auto_heal_n8n.py:/scripts/auto_heal_n8n.py:ro
      - ./logs:/logs
    environment:
      - N8N_DB_PATH=/data/database.sqlite
      - N8N_AUTO_HEAL_MAX_RUNNING_SECONDS=120
      - N8N_AUTO_HEAL_LOOP_SECONDS=60
      - N8N_AUTO_HEAL_LOG_PATH=/logs/n8n-autoheal.log
      - N8N_AUTO_HEAL_EXCLUDED_WORKFLOW_IDS=
    command: ["python", "/scripts/auto_heal_n8n.py"]

volumes:
  postgres_data:
    external: true
    name: projetoatendimentowhatsappinsidesales_postgres_data
  redis_data:
    external: true
    name: projetoatendimentowhatsappinsidesales_redis_data
  evolution_data:
    external: true
    name: projetoatendimentowhatsappinsidesales_evolution_data
  n8n_data:
    external: true
    name: ai_n8n_data
  minio_data:
    external: true
    name: projetoatendimentowhatsappinsidesales_minio_data

networks:
  legacy_runtime:
    external: true
    name: projetoatendimentowhatsappinsidesales_default
